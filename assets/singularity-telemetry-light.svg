<style>
.frame{animation:fade 1s ease-out both}
.orbit{stroke-dasharray:787;animation:draw 2.8s cubic-bezier(0.16, 1, 0.3, 1) .4s both}
.orbit-fill{animation:fade 1.2s ease-out 2.4s both}
.peak{animation:fade .6s ease-out 2.6s both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out 3s infinite}
.ro{animation:rise .9s cubic-bezier(0.16, 1, 0.3, 1) both}
.seg{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(0.16, 1, 0.3, 1) both}
.scan{animation:scan 2.2s cubic-bezier(.4,0,.2,1) .2s both}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:787}}
@keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes scan{0%{opacity:.9;transform:translateX(0)}85%{opacity:.5}100%{opacity:0;transform:translateX(1160px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
