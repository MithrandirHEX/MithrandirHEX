name: Update profile

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch: # manual run button in the Actions tab
  push:
    paths:
      - "profile.config.json"
      - "generator/**"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Install generator dependencies
        working-directory: generator
        run: npm ci

      - name: Generate README and assets
        working-directory: generator
        env:
          GH_TOKEN: ${{ github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: npm run generate

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile"
            git push
          fi
